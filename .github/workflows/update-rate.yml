name: Update BCV USD/VES rate

on:
  schedule:
    # 00:05 UTC = 8:05 PM Venezuela time (UTC-4, no DST).
    # Five minutes past the hour to reduce GitHub Actions cron jitter.
    - cron: "5 0 * * *"
  workflow_dispatch:  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # required to commit back to the repo

concurrency:
  group: update-rate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch rate and update docs/
        run: python update_rate.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/)" ]; then
            git add docs/
            git commit -m "chore: update BCV rate ($(date -u +'%Y-%m-%d'))"
            git push
          else
            echo "No changes to commit."
          fi
